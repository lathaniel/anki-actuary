  - Question: Describe the different levels of diversification
    Answer: |
      <ul>
        <li>(>95% of Revenue) <strong>Single Business</strong></li>
        <li>(70%-95% of Revenue) <strong>Dominant Business</strong></li>
        <li>(<70% of Revenue) <strong>Related Constrained</strong></li>
          <ul>
            <li>
              All businesses share product, tech, & distribution linkages
            </li>
          </ul>
        <li>(<70% of Revenue) <strong>Related Linked</strong></li>
          <ul>
            <li>
              Business only share limited links.
            </li>
          </ul>
        <li>(<70% of Revenue) <strong>Unrelated</strong></li>
          <ul>
            <li>
              Firm's make no effort to share resources between businesses
            </li>
          </ul>
      </ul>
    Section: Strategic Management
